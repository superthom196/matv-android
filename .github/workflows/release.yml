name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the APK to
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Size the build for a 7 GB runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See 'Releases are built by CI' in the README."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/matv.jks"

      - name: Assemble the signed release build
        env:
          MATV_KEYSTORE_PATH: ${{ runner.temp }}/matv.jks
          MATV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MATV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MATV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Check it is signed with the release key, not the debug key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          if grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::APK is debug-signed; the keystore secrets were not picked up."
            exit 1
          fi
          echo "Signed with the release key."

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # If the release already exists (notes written by hand), just attach the APK to it.
          # Otherwise leave a draft so the notes get written before anyone sees it.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "MATV $TAG" --generate-notes
          gh release upload "$TAG" \
            app/build/outputs/apk/release/app-release.apk --clobber
