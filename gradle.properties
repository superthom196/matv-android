# Needs JDK 17+ (Gradle >= 9.1). If Gradle can't find a JDK, set org.gradle.java.home
# in your own ~/.gradle/gradle.properties (not this file, which is committed).
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
